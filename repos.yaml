com.hchen.switchfreeform:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: SwitchFreeForm-v1.2.2025021002._release.apk
    Id: com.hchen.switchfreeform
    LastUpdated: "2025-02-10T07:58:57Z"
    Name: SwitchFreeForm
    ReleaseDescription: |-
      <h3>SwitchFreeForm</h3>
      <h4>更新日志：</h4>
      <ul>
      <li>新增：适配 HyperOS 1。</li>
      <li>新增：Debug 设置，支持自定义部分参数。</li>
      <li>优化：小窗距离屏幕底部过近无法再次触发震动时若手指滑动至屏幕底部则直接震动并进入切换模式。</li>
      <li>优化：横屏时触发切换的逻辑。</li>
      <li>修复：可能的切换失败的问题，提升切换稳定性。</li>
      </ul>
      <h4>模块介绍</h4>
      <ul>
      <li>拖动小窗至全屏时自动将底层全屏应用切换为小窗模式。</li>
      <li>仅支持向下拖动展开的方式。</li>
      </ul>
      <h4>模块说明</h4>
      <ul>
      <li>
      <p>仅在 <code>HyperOS2</code> 测试通过，理论不支持 <code>Miui</code> 系统。</p>
      </li>
      <li>
      <p>安装后勾选<code>系统界面</code>并重启后即可使用。</p>
      </li>
      <li>
      <p>触发自动切换方法：持续拖动小窗直到再次感觉到震动时松开即可，如果底部空间不足以触发再次震动则会在手指滑动至屏幕底部时直接震动进入切换模式。</p>
      </li>
      <li>
      <p>同时支持设置 <code>setprop persist.hchen.switch.freeform.always true</code>，即可始终触发切换，设置 <code>false</code><br>
      禁用，默认禁用。</p>
      </li>
      <li>
      <p>当然可以设置 <code>setprop persist.hchen.switch.freeform.threshold 800</code>，自定义敏感度。 Tip：800<br>
      为默认值，只可设置数字！范围建议 500 - 900，数值越大需要滑动的距离越长。</p>
      </li>
      <li>
      <p>建议的食用方法：</p>
      </li>
      </ul>
      <ul>
      <li>向下拉动小窗控制条直至再次感觉到震动，即可进行切换。</li>
      <li>或者设置 <code>setprop persist.hchen.switch.freeform.always true</code><br>
      始终触发切换，同时使用向上拖动小窗至屏幕顶部来进行仅切换操作（因为拖动至顶部的切换逻辑未修改）。</li>
      </ul>
      <ul>
      <li>Debug 设置：</li>
      <li>你可以设置 debug 来进行调试：</li>
      <li>设置 <code>setprop persist.hchen.switch.freeform.debug.start.delay 450</code><br>
      来指定切换后启动小窗的延迟。用于在获取系统前台应用切换的回调后延迟启动小窗，数值太小可能动画冲突导致<br>
      Bug。</li>
      <li>设置 <code>setprop persist.hchen.switch.freeform.debug.ready.delay 600</code><br>
      来指定准备阶段的延迟。用于等待系统前台应用切换的回调，数值太小可能切换失败。</li>
      </ul>
      <h4>SHA256</h4>
      <ul>
      <li>SHA256: C17C73CA6ECB61DF0836310B31A24524C39B3C8F8B43B678D7810AFD67B8A70C</li>
      </ul>
      <h4>模块分发频道：</h4>
      <ul>
      <li>TG：<a href="https://t.me/HChenX_Module" rel="nofollow">https://t.me/HChenX_Module</a></li>
      </ul>

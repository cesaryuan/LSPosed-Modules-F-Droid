      <code>允许锁定时识别卡片</code></li>\n</ul>\n<h2>\U0001F41B Fixes</h2>\n<ul>\n<li>修复
      <code>编辑指纹快捷功能</code> 功能报错问题</li>\n</ul>\n<p><strong>Full Changelog</strong>:
      <a href=\"https://github.com/Xposed-Modules-Repo/cc.meteormc.yourmiui/commits/7-1.2.1\">https://github.com/Xposed-Modules-Repo/cc.meteormc.yourmiui/commits/7-1.2.1</a></p>"
  AuthorName: Meteor2333
  GitURL: https://github.com/Xposed-Modules-Repo/cc.meteormc.yourmiui
  Host: ""
  License: ""
  Name: ""
  Owner: ""
  Summary: |-
    一款优化 MIUI 系统中各种不友好功能的模块
    A module that improves various pain points in MIUI


    阻止结束特定软件的进程
    解除系统应用不允许关闭通知的限制
    修复传送门无法正常打开链接的问题
    隐藏应用商店中杂乱的赞助商应用推荐
    使手机在未解锁的状态下依然能够识别NFC卡片
    禁用应用安装器的安全检测
    取消设置中二次确认对话框的倒计时
    禁用手机管家中不重要的扫描项
    修复网络助手的校正总是失败的问题
    移除开发者选项中ADB相关设置的开关限制
    清除设置中的系统新版本标记
    禁止超级壁纸暂停
    移除多个系统应用的开屏广告
    编辑指纹快捷功能菜单项
    使软件的启动开屏画面正常显示

      class=\"g-emoji\" alias=\"warning\">⚠️</g-emoji> <strong>Please be sure to backup
      your configuration files before upgrading</strong><br>\nIf you are preparing
      to upgrade to the API 101 environment, please backup your configuration files
      before upgrading. Since API 101 has completely converted local configuration
      files to remote configuration files, failure to backup may result in the loss
      of original configurations.</p>\n<p><g-emoji class=\"g-emoji\" alias=\"warning\">⚠️</g-emoji>
      <strong>Crash Troubleshooting</strong><br>\nIf the app crashes upon opening,
      please try disabling the \"Hide My Applist\" module and restart your phone.</p>\n<p><g-emoji
      class=\"g-emoji\" alias=\"warning\">⚠️</g-emoji> <strong>Frida experimental
      adaptation testing is now open</strong><br>\nThe latest release has added experimental
      adaptation support for Frida. Please note that this feature is currently in
      early testing and is not an official replacement for LSPosed.</p>\n<p>\U0001F4CC
      <strong>Current Adaptation Status</strong></p>\n<ul>\n<li>LSPosed is unaffected,
      can be used normally, and its usage remains unchanged</li>\n<li>Frida adaptation
      is intended only for advanced users familiar with <code>frida-server</code>
      and script injection</li>\n<li>The current focus is primarily on verifying standard
      Java method Hook capabilities</li>\n<li>Full compatibility with LSPosed is not
      guaranteed, nor is the stability across all features and related processes</li>\n</ul>\n<p>\U0001F6E0️
      <strong>Requirements for participating in the test</strong></p>\n<ul>\n<li>Proficiently
      deploy and run <code>frida-server</code></li>\n<li>Understand and independently
      complete script injection</li>\n<li>Ability to modify and adjust script configurations</li>\n<li>Ability
      to independently troubleshoot compatibility issues and basic bugs</li>\n</ul>\n<p>❌
      <strong>Current features only support the API 101 environment</strong></p>\n<p>\U0001F4CC

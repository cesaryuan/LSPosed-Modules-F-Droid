io.github.icepony.alwaysbatterysaver:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: AlwaysBatterySaver_v2.1-debug.apk
    Id: io.github.icepony.alwaysbatterysaver
    LastUpdated: "2025-04-22T07:18:39Z"
    Name: Always Battery Saver
    ReleaseDescription: |-
      <p>This update includes significant improvements to how the module works, offering more reliable control over Battery Saver and introducing new options.</p>
      <p><strong>Changes:</strong></p>
      <ul>
      <li><strong>Improved Reliability:</strong> The core logic that prevents Battery Saver from turning off has been completely rewritten. This should improve compatibility across different devices and Android versions.</li>
      <li><strong>New Control Options:</strong>
      <ul>
      <li><strong>Prevent Disabling on Power:</strong> A new setting has been added that stops Battery Saver from automatically turning off <em>only</em> when your device is plugged in and detected as charging.</li>
      <li><strong>Hide Charging Status:</strong> This new option replaces the old "Block update charge state". It works by preventing the system from telling the Battery Saver component that your device is charging. This is another way to help keep Battery Saver active while plugged in.</li>
      <li><strong>'Lock Battery Saver State' Updated:</strong> The experimental option to aggressively block <em>any</em> change to Battery Saver status has been updated internally.</li>
      </ul>
      </li>
      <li><strong>Visual Tweaks:</strong> Added basic support for Dark Mode and made minor adjustments to the settings screen layout.</li>
      </ul>
      <p><strong>Minor Improvements:</strong></p>
      <ul>
      <li>In debug builds, the settings options will remain selectable even when the main 'Enable Module' switch is off.</li>
      </ul>
      <p>We've made big changes under the hood, so please try out the new options and report any issues you find!</p>
      <p><strong>Full Changelog</strong>: <a class="commit-link" href="https://github.com/icepony/AlwaysBatterySaver/compare/v2.0...v2.1">icepony/AlwaysBatterySaver@<tt>v2.0...v2.1</tt></a></p>
  AuthorName: icepony
  GitURL: https://github.com/Xposed-Modules-Repo/io.github.icepony.alwaysbatterysaver
  Host: ""
  License: ""
  Name: ""
  Owner: ""
  Summary: Allows you to keep Battery Saver enabled

    ReleaseDescription: "<p>完善js hook，另外vsocde和傻瓜式编程工具curosr都可以在市场搜索插件HOOKUI 关键词 下载，然后新建2个js把下面的内容发给它，你就可以让他继续帮你写
      指定的定制hook代码了，让他遵循hook回调是这种模式 ，基本是仿造xposed api来的，降低学习成本。<br>\n然后写完代码直接就邮件同步 直接被hook应用就能重启了，记得在第一行写上//package:com.xx.xx
      不然重启功能玩不了，还有默认情况是没有开启js加载的，非赞助用户可以在里面直接手动点那个测试运行就好了。 效果是一样的，只是不能启动就加载。</p>\n<div
      class=\"snippet-clipboard-content notranslate position-relative overflow-auto\"
      data-snippet-clipboard-copy-content=\"//package:com.xx.xx\n//第一行指定被hook的包名，方便VSCode
      Cursor插件识别包名进行真正的重启!\n//HOOKUI 动态js 仅限使用2024-12-29 19:25:40 之后版本使用\n//findAndHookMethod
      在2015年1月4日版本有效\nfunction handleLoadPackage(loadPackageParam) {\n\n    log.toast(&quot;COMMON_AAAJS:&quot;
      + loadPackageParam.packageName);\n    log.v(&quot;COMMON_JS-AAFF-&gt;&quot;
      + loadPackageParam.packageName);  \n\n    try {\n        // Hook View 的触摸事件\n
      \       XposedHelpers.findAndHookMethod(&quot;android.view.View&quot;, \n       \n
      \           &quot;onTouchEvent&quot;,\n            [&quot;android.view.MotionEvent&quot;],\n
      \           function(param, phase) {\n                if (phase === &quot;before&quot;)
      {\n                    try {\n                        var Arrays = Packages.java.util.Arrays;\n
      \                       let args = param.getArguments();\n                        \n
      \                       if(args &amp;&amp; args[0]) {\n                            let
      motionEvent = args[0];\n                            let x = motionEvent.getX();\n
      \                           let y = motionEvent.getY();\n                            let
      action = motionEvent.getAction();\n                            \n                            log.v(&quot;触摸事件:
      x=&quot; + x + &quot;, y=&quot; + y + &quot;, action=&quot; + action);\n                        }\n
      \                       \n                        // 检查 args 是否为数组\n                        if
      (args ) {\n                            log.v(&quot;触摸参数: &quot; + Arrays.toString(args));\n
      \                       } else {\n                            log.v(&quot;触摸参数:
      获取定义失败&quot;+args);\n                        }\n                    } catch(e)
      {\n                        log.e(&quot;View onTouchEvent hook error: &quot;
      + e);\n                    }\n                } else if (phase === &quot;after&quot;)
      {\n                    log.v(&quot;调用堆栈: &quot; + log.getStackTraceString());\n
      \               }\n            }\n        );\n    } catch(e) {\n        log.e(&quot;找不到
      View.onTouchEvent 方法: &quot; + e);\n    }\n\n    // Hook Activity 创建\n    XposedHelpers.findAndHookMethod(&quot;android.app.Activity&quot;,\n
      \       loadPackageParam.classLoader,\n        &quot;onCreate&quot;,\n        [&quot;android.os.Bundle&quot;],\n
      \       function(param, phase) {\n            if (phase === &quot;before&quot;)
      {\n                log.v(&quot;检测到新Activity创建&quot;);\n                try {\n
      \                   log.v(&quot;当前时间: &quot; + new Date().toLocaleString());\n
      \               } catch(e) {\n                    log.v(&quot;Activity Hook
      触发&quot;);\n                }\n            } else if (phase === &quot;after&quot;)
      {\n                log.v(&quot;Activity onCreate 完成&quot;);\n            }\n
      \       }\n    );\n\n    // Hook Dialog 显示\n    XposedHelpers.findAndHookMethod(&quot;android.app.Dialog&quot;,\n
      \       loadPackageParam.classLoader,\n        &quot;show&quot;,\n        [],\n
      \       function(param, phase) {\n            if (phase === &quot;before&quot;)
      {\n                log.v(&quot;检测到Dialog显示&quot;);\n                try {\n
      \                   log.v(&quot;当前时间: &quot; + new Date().toLocaleString());\n
      \               } catch(e) {\n                    log.v(&quot;Dialog Hook 触发&quot;);\n
      \               }\n            } else if (phase === &quot;after&quot;) {\n                log.v(&quot;Dialog

    Name: 信驿 Relay
    ReleaseDescription: |-
      <div align="center">
        <a href="https://play.google.com/store/apps/details?id=io.github.magisk317.xinyi.relay" rel="nofollow">
          <img src="https://camo.githubusercontent.com/2ea3b1d605be783034a4a4cf364f24cdd29b52f60caf0892b03c3e53e85b91ce/68747470733a2f2f706c61792e676f6f676c652e636f6d2f696e746c2f656e5f75732f6261646765732f7374617469632f696d616765732f6261646765732f656e5f62616467655f7765625f67656e657269632e706e67" alt="Get it on Google Play" height="80" data-canonical-src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" style="max-width: 100%; height: auto; max-height: 80px;">
        </a>
        <a href="https://github.com/magisk317/xinyi-relay/releases/tag/v0.1.1">
          <img src="https://raw.githubusercontent.com/machiav3lli/oandbackupx/master/badge_github.png" alt="Get it on GitHub" height="80" style="max-width: 100%; height: auto; max-height: 80px;">
        </a>
        </div>
      <h2>[v0.1.1] - 2026-05-01</h2>
      <ul>
      <li>版本：<code>versionCode 21</code> / <code>versionName 0.1.1</code>。</li>
      </ul>
      <div class="markdown-alert markdown-alert-important"><p class="markdown-alert-title"><svg class="octicon octicon-report mr-2" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>Important</p><p>为了降低代码复杂度与维护成本，从这个版本开始，只提供api101版本，不再打legacy版本，使用旧版本框架或其他fork的尽快升级</p>
      </div>
      <ul>
      <li>
      <p><code>[desktop]</code> 新增信驿 Desktop 桌面端初始实现：基于 Tauri + React + Vite 构建，支持 Windows/macOS/Linux，提供配置管理、实时状态刷新、记录查看与发送器编辑能力。</p>
      </li>
      <li>
      <p><code>[sender]</code> 发送器能力继续完善：新增发送器生效时段，支持按时间窗口启停；邮件发送器拆分认证身份与对外展示身份，减少多账户或代发场景下的配置耦合；发送器与远程配置入口也同步收口，常用设置路径更直观。</p>
      </li>
      <li>
      <p><code>[backup]</code> 备份与导出链路增加发送器配置完整性检查，并兼容旧 JSON 中遗留的 sender 字段与参数格式，恢复时能更稳地保留历史通道配置。</p>
      </li>
      <li>
      <p><code>[performance]</code> 优化偏好项读取性能：为 <code>PrefsReader</code> 增加 10 秒 TTL 缓存，显著降低高频 Hook 场景下的跨进程或磁盘 IO 开销。</p>
      </li>
      <li>
      <p><code>[sms-hook]</code> 增强短信转发稳定性：SmsHandlerHook 引入内存二级去重缓存与非阻塞文件同步，并为短信解析增加严格超时判定；新增可配置短信转发去重窗口、验证码长窗口去重、相同验证码重复自动输入拦截，同时合并 <code>DELIVER/RECEIVED</code> 双广播去重并将窗口扩展到 60 秒，压制重复转发、重复填码与通知回环。</p>
      </li>
      <li>
      <p><code>[runtime]</code> 新增安全自定义消息广播入口，并将通知门控查询、提醒电量接收等数据库与广播处理移出主线程，降低界面线程阻塞风险。</p>
      </li>
      <li>
      <p><code>[ui]</code> 记录详情弹层改为限高滚动布局，长内容场景下浏览与复制更稳定。</p>
      </li>
      <li>
      <p><code>[maintenance]</code> 引入自动化 Gradle 维护插件：自动清理主工程、build-logic 及所有子模块的旧版 Gradle 缓存，保持开发环境整洁。</p>
      </li>
      <li>
      <p><code>[diagnostics]</code> 增加入站短信 Hook 诊断输出，结合更新后的 <code>REFACTORING</code> 文档，排查兼容性与拦截异常时更容易定位问题。</p>
      </li>
      <li>
      <p><code>[test]</code> 补充 DataStore 自动修复逻辑、依赖强制规则合并行为等回归测试，提升配置系统与依赖治理脚本的稳健性。</p>
      </li>
      <li>
      <p><code>[submodule]</code> 同步更新 <code>smscode-core</code> (含 Android 16 兼容性文档) 与 <code>magisk-ui-kit</code> 子模块指针。</p>
      </li>
      <li>
      <p><code>[release/tag]</code> 发布入口从单一整包 tag 扩展为组件化 tag：<code>v0.1.1</code> 继续代表完整发布，另新增 <code>mobile-v0.1.1</code>、<code>desktop-v0.1.1</code>、<code>backend-v0.1.1</code>，分别驱动移动端、桌面端和后端的独立发布链路；<code>scripts/release_ref.sh</code> 统一负责 tag 生成、解析与 release kind 判断。</p>
      </li>
      <li>
      <p><code>[release/script]</code> <code>scripts/release_tag.sh</code> 现支持 <code>all|mobile|desktop|backend</code> 目标参数；仅 <code>all/mobile</code> 会同步 Android <code>distribution/whatsnew</code>、Fastlane changelog 与截图，<code>desktop/backend</code> 则跳过移动端元数据同步，避免组件发布被无关校验阻塞。</p>
      </li>
      <li>
      <p><code>[release/guard]</code> <code>scripts/check_release_guard.sh</code> 已按 release kind 分流：完整版与移动端 tag 继续校验 <code>CHANGELOG</code>、<code>distribution/whatsnew</code>、Fastlane metadata、截图与 tag/version 一致性；桌面端和后端 tag 则只保留与自身相关的版本和提交卫生检查。</p>
      </li>
      <li>
      <p><code>[ci/mobile]</code> Android 发布工作流现同时支持完整 tag 与 <code>mobile-v*</code>；GitHub Draft Release、Google Play 轨道选择、Xposed-Modules-Repo 发布、符号包上传与 release title 解析都统一走 <code>release_ref.sh</code>，减少脚本和 workflow 各自解析 tag 带来的分叉。</p>
      </li>
      <li>
      <p><code>[ci/desktop]</code> Desktop Release 工作流支持 <code>desktop-v*</code> 独立发布：若使用完整 tag，会等待移动端 workflow 创建同名 Release 后再补传桌面资产；若使用桌面组件 tag，则直接创建或更新桌面专用 Draft Release，方便桌面端单独迭代。</p>
      </li>
      <li>
      <p><code>[ci/backend]</code> Backend GHCR 发布工作流支持 <code>backend-v*</code> 独立镜像发布：<code>beta</code> 分支继续维护 <code>beta</code> 通道，多架构 manifest 仍会在完整 tag 下同步推送 <code>latest</code> 与版本标签，而后端组件 tag 会单独生成镜像说明并创建对应 GitHub Release 草稿。</p>
      </li>
      <li>
      <p><code>[notification]</code> Telegram 发布通知已按 release kind 切换内容来源：完整版/移动端继续引用 <code>distribution/whatsnew</code>，桌面端与后端则改为输出对应组件发布说明，避免沿用移动端文案误导用户。</p>
      </li>
      <li>
      <p><code>[xposed/build]</code> 移动端构建继续收敛到 libxposed 单轨：应用依赖与发布资产命名不再围绕 <code>legacy/api101</code> 双 flavor 展开，GitHub/Play 产物、AAB 路径、更新检查与 CI 任务名进一步统一，为后续只维护当前主线构建打基础。</p>
      </li>
      <li>
      <p><code>[ci/fix]</code> 发布工作流中的 APK artifact 下载名已与上传名重新对齐，避免 Release/Xposed-Modules-Repo 阶段因匹配不到 <code>apks-github</code> 而出现“构建成功但发布阶段无资产”的假失败。</p>
      <p>Source: <a href="https://github.com/magisk317/xinyi-relay/releases/tag/v0.1.1">https://github.com/magisk317/xinyi-relay/releases/tag/v0.1.1</a></p>
      </li>
      </ul>

com.flass.layoutinspect:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: Layout.Inspect_1.1.4_18_armAll_101.APK
    Id: com.flass.layoutinspect
    LastUpdated: "2026-03-31T10:57:44Z"
    Name: Layout Inspect
    ReleaseDescription: |-
      <p>1.爆肘 SystemUI，完美捕获”系统布局“（锁屏、状态栏、通知栏、指纹等等）<br>
      2.增强 Dump Dex：完美脱壳某企业壳，还原Nop，不闪退<br>
      3.增强”类加载器“功能，从内存中读取，不放过任何一个类加载器，与Frida一样强大（因此也解决了算法助手冲突问题）<br>
      4.增强”搜索类名“：既然类加载器一个都不放过，那么类名自然也一个都跑不掉<br>
      5.新增”控件转图片“的新方案，比之前的更加稳定，之前的也保留<br>
      6.新增”修改前景 (仅支持纯色)“的选项，可将前景修改成纯色（长按foreground弹出）<br>
      7.新增”修改背景 (仅支持纯色)“的选项，可将背景修改成纯色（长按background弹出）<br>
      8.增强”过滤堆栈“的功能，自动过滤LSPosed的一些类名<br>
      9.修复因宿主篡改 DisplayMetrics 时，导致单位转换与系统标准不一致（如QQ等）<br>
      10.修复 Configuration 问题，修复横屏模式下捕获布局的高度异常问题<br>
      11.由于适配 SystemUI，模块需要大变动，顺手搞模块的所有窗口”均可拖拽“<br>
      12.目前所有提示窗口已支持长按快速复制保存路径<br>
      13.增强 Dump So 功能的兼容性，目前在真机或者模拟器64/32位稳定发挥<br>
      14.线程调整：调整2个线程池处理堆栈，其他耗时操作共用1个线程池（总占3线程）<br>
      Ps：模块已兼容 LSPosed的 三种API（82，100，101），两个包，自行选择</p>
  AuthorName: Flassers
  GitURL: https://github.com/Xposed-Modules-Repo/com.flass.layoutinspect
  Host: ""
  License: ""
  Name: ""
  Owner: ""
  Summary: Layout Inspect是一款逆向必备的工具：它具备以下功能：应用进程、捕获布局（兼容各种窗口类型，包含临时上帝模式）、活动记录、类加载器（记录动态加载器）、搜索类名（包含动态加载类）、Inject
    So（注入So文件）、Dump So（与Frida枚举So类似）、Dump Dex（脱壳Dex加固）、Dump Maps（内存映射）、Dump Xml（解密Axml）、Dump
    Asset（解密Assets）、移除安全限制（截屏限制）、调试浏览器等等。

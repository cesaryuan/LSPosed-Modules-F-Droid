      Normal: 需要存储权限进行写入配置，以及读取记录（Log），同样适用于LSPatch，安卓13需要每个应用单独授予权限<br>
      Lite: 无需任何权限，仅用于LSPosed，无扩展功能，无记录功能，安卓版本 &gt;8</p>

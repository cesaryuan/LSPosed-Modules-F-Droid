      <h2>更新日志</h2>
      <ul>
      <li>迁移至 <strong>Modern Xposed Module API（Libxposed API 101）</strong></li>
      <li>由于弃用 <strong>XSharedPreferences</strong>，本次更新后所有配置项将会丢失，请务必在更新前备份配置，并在更新后重新进行设置</li>
      <li>适配 <strong>HyperOS 3.0（包括 3.0.300+）</strong>。本版本仅供 HyperOS 3 用户使用，对 HyperOS 2 及更早版本的支持已被移除</li>
      <li>新增功能：<strong>系统界面 → 图标定制 → 双排信号图标</strong></li>
      <li>新增功能：<strong>系统界面 → 图标调整 → 组合图标</strong></li>
      <li>新增功能：<strong>系统界面 → 图标调整 → 状态栏图标左移</strong></li>
      <li>新增功能：<strong>系统界面 → 手势与操作 → 单击 / 双击空白区域触发特定动作</strong></li>
      <li>大量细节与功能已作调整与优化，暂不一一列出，欢迎自行探索</li>
      <li>欢迎加入 <a href="https://t.me/lackluster_stuff" rel="nofollow">Telegram 频道</a> 反馈问题、获取内部测试版本与后续更新信息</li>
      </ul>
      <hr>
      <h2>What's Changed</h2>
      <ul>
      <li>Migrated to the <strong>Modern Xposed Module API (Libxposed API 101)</strong></li>
      <li><strong>XSharedPreferences</strong> has been deprecated. As a result, all existing configurations will be lost after updating. Please back up your settings in advance and reconfigure them after the update</li>
      <li>Added support for <strong>HyperOS 3.0 (including 3.0.300+)</strong>. This version is intended <strong>only for HyperOS 3</strong>; support for HyperOS 2 and earlier has been removed</li>
      <li>New feature: <strong>System UI → Icon customizer → Dual-row signal icons</strong></li>
      <li>New feature: <strong>System UI → Icon tuner → Combined icons</strong></li>
      <li>New feature: <strong>System UI → Icon tuner → Shift status bar icons to the left</strong></li>
      <li>New feature: <strong>System UI → Single / double tap on empty area to trigger specific actions</strong></li>
      <li>Numerous behavior tweaks and refinements have been made and are not fully listed here—feel free to explore</li>
      <li>Join our <a href="https://t.me/lackluster_stuff" rel="nofollow">Telegram channel</a> to report issues, get insider builds, and stay up to date with future releases</li>

ps.reso.instaeclipse:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: InstaEclipse.0.5.0.apk
    Id: ps.reso.instaeclipse
    LastUpdated: "2026-04-14T20:29:37Z"
    Name: InstaEclipse
    ReleaseDescription: "<h1>\U0001F318 InstaEclipse v0.5.0 — The Biggest Update Yet</h1>\n<blockquote>\n<p><g-emoji
      class=\"g-emoji\" alias=\"warning\">⚠️</g-emoji> <strong>Fresh install required.</strong>
      Uninstall your previous version before installing v0.5.0.</p>\n</blockquote>\n<hr>\n<h2>✨
      This isn't just an update. It's a rebuild.</h2>\n<p>v0.5.0 ships a completely
      overhauled companion app, a brand new downloader, new ghost features, global
      language support, and a wave of long-requested additions. If you've been waiting
      for a reason to reinstall — this is it.</p>\n<hr>\n<h2>\U0001F4E5 All-New Downloader</h2>\n<p>Save
      anything. Posts, carousels, reels, stories, feed videos, and full-resolution
      profile pictures — all from within Instagram, no third-party app needed.</p>\n<ul>\n<li>Long-press
      any profile to save the full-res picture</li>\n<li>Choose a custom download
      folder - From the InstaEclipse Module UI</li>\n<li>Optional username subfolders
      to keep everything organized</li>\n</ul>\n<hr>\n<h2>\U0001F47B New Ghost Features</h2>\n<p>Three
      powerful additions to Ghost Mode:</p>\n<ul>\n<li><strong>Unlimited View-Once
      Replays</strong> — Replay view-once media as many times as you want</li>\n<li><strong>Permanent
      View Once Media</strong> — View-once media stays open and replayable like regular
      media (This might cause issues)</li>\n<li><strong>Keep Disappearing Messages</strong>
      — Stop ephemeral messages from deleting themselves</li>\n<li><strong>Allow Screenshots
      in DMs</strong> — Re-enable screenshot capability in restricted chats</li>\n</ul>\n<hr>\n<h2>\U0001F3A8
      Brand New App UI</h2>\n<p>The InstaEclipse companion app has been completely
      redesigned from scratch. Material You, sectioned menus, a staging system that
      lets you queue multiple changes and apply them all at once — it feels like a
      different app.</p>\n<hr>\n<h2>⚙️ Developer Options</h2>\n<ul>\n<li><strong>Remove
      Build Expired Popup</strong> — Keep using older Instagram builds without the
      forced update nag</li>\n</ul>\n<hr>\n<h2>\U0001F6E0️Miscellaneous</h2>\n<ul>\n<li><strong>Copy
      Comment</strong> — Copy any comment text with a single tap</li>\n<li><strong>View
      Story Mentions</strong> — See all @mentions in a story at once</li>\n<li><strong>Disable
      Discover People</strong> — Remove the \"People you may know\" section from your
      feed</li>\n</ul>\n<hr>\n<h2>\U0001F4BE Backup &amp; Restore</h2>\n<p>Export
      all your InstaEclipse settings to a file and restore them anytime — perfect
      for switching devices or reinstalling without losing your setup.</p>\n<hr>\n<h2>\U0001F30D
      InstaEclipse Now Speaks 14 Languages</h2>\n<p>Arabic · Azerbaijani · German
      · Spanish · French · Greek · Hebrew · Indonesian · Portuguese · Russian · Swedish
      · Turkish · Traditional Chinese · Simplified Chinese</p>\n<p>Every string, every
      dialog, every toast — fully translated. Massive thanks to every contributor
      who made this happen.</p>\n<hr>\n<h2>⚡ DexKit Startup Cache</h2>\n<p>DexKit
      scans are now cached per Instagram version. Same version = zero rescan on next
      launch. Faster startup, every time.</p>\n<hr>\n<h2>\U0001F41B Bug Fixes</h2>\n<ul>\n<li>Ghost
      mode toggles now correctly persist their state across sessions</li>\n<li>Various
      stability and compatibility improvements</li>\n</ul>\n<hr>\n<h2>\U0001F4C4 Project</h2>\n<ul>\n<li>README
      fully rewritten with collapsible feature sections, full root + no-root install
      guides, and a live contributor grid</li>\n<li><code>DISCLAIMER.md</code> added</li>\n<li>GitHub
      issue templates — structured bug reports and feature requests with pre-flight
      checklists</li>\n</ul>\n<hr>\n<h3>\U0001F499 Thank you for every star, report,
      and translation. v0.5.0 is for you.</h3>\n<h2>What's Changed</h2>\n<ul>\n<li>Version
      0.5.0 by <a class=\"user-mention notranslate\" data-hovercard-type=\"user\"
      data-hovercard-url=\"/users/ReSo7200/hovercard\" data-octo-click=\"hovercard-link-click\"
      data-octo-dimensions=\"link_type:self\" href=\"https://github.com/ReSo7200\">@ReSo7200</a>
      in <a class=\"issue-link js-issue-link\" data-error-text=\"Failed to load title\"
      data-id=\"4249316674\" data-permission-text=\"Title is private\" data-url=\"https://github.com/ReSo7200/InstaEclipse/issues/154\"
      data-hovercard-type=\"pull_request\" data-hovercard-url=\"/ReSo7200/InstaEclipse/pull/154/hovercard\"
      href=\"https://github.com/ReSo7200/InstaEclipse/pull/154\">ReSo7200/InstaEclipse#154</a></li>\n</ul>\n<p><strong>Full
      Changelog</strong>: <a class=\"commit-link\" href=\"https://github.com/ReSo7200/InstaEclipse/compare/v0.4.5...v0.5.0\">ReSo7200/InstaEclipse@<tt>v0.4.5...v0.5.0</tt></a></p>"
  AuthorName: ReSo7200
  GitURL: https://github.com/Xposed-Modules-Repo/ps.reso.instaeclipse

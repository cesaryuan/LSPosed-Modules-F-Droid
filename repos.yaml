      in-app instructions with a user interface for controlling whether app downgrades
      are allowed or blocked.</li>\n<li>Removed hook for automatically adding the
      Quick Settings tile to the tile drawer.</li>\n</ul>\n<h3>\U0001F4F0 Important
      News about Upcoming Let Me Downgrade Releases</h3>\n<p>This release is going

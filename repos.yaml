com.mantle:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: Mantle.v2.5.1-05.04.26.apk
    Id: com.mantle
    LastUpdated: "2026-04-06T12:01:35Z"
    Name: Mantle - A layer between you and apps.
    ReleaseDescription: "<h1>Release v2.5.1 — 1100+ Real Device Profiles &amp; Backup
      Fixes</h1>\n<h2>\U0001F195 New Features</h2>\n<ul>\n<li><strong>1100+ Real Device
      Profiles</strong>: Added a massive database of 1,100+ real device fingerprints.
      Every profile now feels like a real phone.</li>\n<li><strong>Improved WebView
      Compatibility</strong>: More accurate user agents.</li>\n<li><strong>Device
      Selection UI Updated</strong>: You can now filter by Android version.</li>\n<li><strong>Full
      Sensor Passthrough</strong>: All standard hardware sensors (magnetometer, barometer,
      gyroscope) are now reported correctly.</li>\n</ul>\n<h2>\U0001F41E Bug Fixes</h2>\n<ul>\n<li>Fixed
      session conflict loop when switching devices.</li>\n<li>Fixed proxy leakage
      into new profiles.</li>\n<li>Fixed KernelSU/APatch warnings.</li>\n</ul>\n<h2>\U0001F4C0
      Profile Backup &amp; Restore — Fixed</h2>\n<p>Critical fix for profile switching
      — previously, switching profiles could lose your logged-in account data. The
      backup/restore path is now rock solid:</p>\n<ul>\n<li>✅ <strong>Switch profiles</strong>
      without losing login state.</li>\n<li>✅ <strong>Export captures the latest live
      data</strong> (no more stale backups).</li>\n<li>✅ <strong>Import → Switch</strong>
      works correctly after a format/reinstall.</li>\n</ul>\n<h2>⚡️ Improvements</h2>\n<ul>\n<li>Faster
      backups.</li>\n<li>Faster &amp; smoother profile switching.</li>\n<li>Multi-device
      support: request access for multiple devices on the same account.</li>\n<li>Smarter
      backup import: overwrites cleanly instead of creating broken duplicate directories.</li>\n<li>Better
      stability &amp; under-the-hood performance improvements.</li>\n</ul>\n<hr>\n<h2><g-emoji
      class=\"g-emoji\" alias=\"warning\">⚠️</g-emoji> IMPORTANT: Updater Instructions</h2>\n<p><strong>1.
      Backup before updating!</strong><br>\nGo to <code>Any Group -&gt; Config Settings
      -&gt; Export Backup</code>.</p>\n<p><strong>2. AFTER UPDATE: App Crashing? Quick
      Fix</strong><br>\nIf any app is crashing or force-closing after Mantle is applied,
      it's likely due to an incompatible device profile. Here's how to fix it in 30
      seconds:</p>\n<p><strong>Steps:</strong><br>\n1️⃣ Open <strong>Mantle</strong>
      → Go to the <strong>Identity</strong> tab<br>\n2️⃣ Scroll down to the <strong>Device</strong>
      section<br>\n3️⃣ Tap <strong>CHANGE</strong><br>\n4️⃣ Hit the \U0001F504 <strong>refresh</strong>
      icon to reload the latest device list<br>\n5️⃣ Tap the <strong>RANDOM</strong>
      button once — this will assign a new compatible device profile<br>\n6️⃣ Reopen
      the app that was crashing</p>\n<p>✅ That's it! The app should work now.</p>\n<p><g-emoji
      class=\"g-emoji\" alias=\"warning\">⚠️</g-emoji> <strong>Why does this happen?</strong><br>\nSome
      device profiles use an older Android version that conflicts with newer apps.
      Hitting RANDOM picks a fresh profile that's compatible.</p>\n<p>If the app still
      crashes after trying this, repeat the steps once more or send your LSPosed log
      in DM.</p>"
  AuthorName: get-mantle

com.haostoo.wetypehookr:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: app-universal-release.apk
    Id: com.haostoo.wetypehookr
    LastUpdated: "2026-04-30T08:27:49Z"
    Name: WeTypeHookR
    ReleaseDescription: |-
      <h2>本模块迎来大变！</h2>
      <hr>
      <ul>
      <li>移除原有的模块界面</li>
      </ul>
      <ul>
      <li>新增寄生设置页，设置打开方式：<em><strong>微信输入法设置-&gt;帮助与反馈</strong></em>。<br>
      <em>（部分修改版移除了微信输入法的桌面图标，不过实测仍可通过键盘界面打开设置）</em></li>
      </ul>
      <ul>
      <li>
      <p>移除了hook成功的toast提示，改为在模块目录下生成文件标记(<em>hookstatus.txt</em>)，当方法找到hook成功时生成，记录hook注入时间。<br>
      <em>（有的系统好像经常会把键盘进程干掉导致频繁弹toast比较碍事，想来可能需要看这个toast的也不是很多毕竟用手一点就知道成没成功了）</em></p>
      </li>
      <li>
      <p>提供的快速重载功能，用于快速重启输入法子进程</p>
      </li>
      <li>
      <p>好像也没有别的了，功能都在设置页写了。<br>
      对了选择<a href="https://developer.android.com/reference/android/view/HapticFeedbackConstants" rel="nofollow"><em><strong>系统预设风格</strong></em></a>的下拉菜单是<strong>可以滑动</strong>的。一共有二十种预设风格选择。由于Android版本不同和厂商魔改可能会导致有的效果<strong>不生效</strong>或者<strong>很诡异</strong>，自行体验。</p>
      </li>
      <li>
      <p>模块的配置文件位于<code>/storage/emulated/0/Android/data/com.tencent.wetype/files/haostoo/</code>，<code>config/config.xml</code>为配置文件，可以直接精确数值修改（不过意义不是很大就是了反正最后都要换算到0~255再取整），<code>hookstatus.txt</code>为hook标记，前文提过。</p>
      </li>
      </ul>
      <hr>
      <p>以上</p>
      <p>继续欢迎带日志反馈，有日志反馈我就尽量修，没反馈我自用没问题就不管了。<br>
      然后我要研究怎么做下滑快捷操作顺便好好学学kotlin了，这个好像没我想的那么简单。短时间内如果没有严重问题估计不会更新了。</p>
  AuthorName: Hao-o0o
  GitURL: https://github.com/Xposed-Modules-Repo/com.haostoo.wetypehookr
  Host: ""
  License: ""
  Name: ""
  Owner: ""
  Summary: 改造微信输入法的按键震动。

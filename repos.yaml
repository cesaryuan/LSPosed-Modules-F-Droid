com.wizpizz.onepluspluslauncher:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: app-release.apk
    Id: com.wizpizz.onepluspluslauncher
    LastUpdated: "2025-08-11T13:41:22Z"
    Name: OnePlusPlusLauncher
    ReleaseDescription: "<p><strong>Synced from main repo release: v1.2.1</strong></p>\n<h1>\U0001F680
      OnePlusPlusLauncher v1.2.1 Release</h1>\n<h2>\U0001F4DD Changelog</h2>\n<ul>\n<li>Misc:\n<ul>\n<li>[<a
      href=\"https://github.com/wizpizz/OnePlusPlusLauncher/issues/4\" data-hovercard-type=\"pull_request\"
      data-hovercard-url=\"/wizpizz/OnePlusPlusLauncher/pull/4/hovercard\">#4</a>]
      Fuzzy search now uses the lightweight <a href=\"https://github.com/seatgeek/fuzzywuzzy\">FuzzyWuzzy</a>
      library that utilizes the <a href=\"https://en.wikipedia.org/wiki/Levenshtein_distance\"
      rel=\"nofollow\">Levenshtein Distance</a> algorithm to find the closest match.<br>\nIt
      handles simple typos well without any noticeable performance degredation.<br>\nThe
      code has also been tweaked to sanitize spaces &amp; quotation marks from the
      query, since users of non-English IMEs (e.g. Chinese Pinyin) often produce search
      queries with such characters.<br>\nThe calculation method has also been tweaked
      to prefer matches where the query is a prefix of the target or if the query
      chars subsequently appear in the target. (Thanks to <strong><a href=\"https://github.com/deltazefiro\">@deltazefiro</a></strong>!)</li>\n</ul>\n</li>\n</ul>\n<p>Full
      Changelog: <a href=\"https://github.com/wizpizz/OnePlusPlusLauncher/compare/v1.2.0...v1.2.1\"><code>v1.2.0...v1.2.1</code></a></p>\n<h2>⬇️
      Installation</h2>\n<ol>\n<li>Make sure your device is rooted and you have LSPosed
      installed.</li>\n<li>Download the latest release APK from the assets section
      below or simply <a href=\"https://github.com/Xposed-Modules-Repo/com.wizpizz.onepluspluslauncher/releases/download/4-1.2.1/app-release.apk\">click
      here</a></li>\n<li>Install the APK on your device.</li>\n<li>Enable the module
      in the LSPosed manager and make sure System Launcher is enabled in the scope
      settings.</li>\n<li>Restart System Launcher.</li>\n</ol>\n<p>(Restarting the
      launcher may be necessary for changes to take effect after toggling features.)</p>"
  AuthorName: wizpizz
  GitURL: https://github.com/Xposed-Modules-Repo/com.wizpizz.onepluspluslauncher
  Host: ""
  License: ""
  Name: ""
  Owner: ""
  Summary: ⚡ An XPosed module for the System Launcher on OnePlus' OxygenOS 15, providing
    extra useful features
com.wizpizz.reddidnt:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: app-release.apk
    Id: com.wizpizz.reddidnt
    LastUpdated: "2025-11-18T20:18:46Z"
    Name: 1. LSPosed Reddit Ad Blocker | Reddidn't
    ReleaseDescription: "<h1>\U0001F680 Reddidn't v1.2.2 Release</h1>\n<p>This release
      fixes external browser redirect for Reddit internal browser intents.</p>\n<p><strong>This
      version of Reddidn't has been tested and aims to work on Reddit v2025.46.0 and
      above.</strong></p>\n<h2>\U0001F4DD Changelog</h2>\n<ul>\n<li>\U0001F527 Fixes:\n<ul>\n<li>External
      browser redirect for Reddit internal browser intents</li>\n</ul>\n</li>\n</ul>\n<h2>Installation</h2>\n<h3>Root
      | LSPosed</h3>\n<ol>\n<li>Make sure your device is rooted and you have LSPosed
      installed.</li>\n<li>Download the latest release APK from the assets section
      below or simply <a href=\"https://github.com/Xposed-Modules-Repo/com.wizpizz.reddidnt/releases/download/7-1.2.2/app-release.apk\">click
      here</a></li>\n<li>Install the APK on your device.</li>\n<li>Enable the module
      in the LSPosed manager and make sure Reddit is enabled in the scope settings.</li>\n<li>Restart
      Reddit and Reddidn't.</li>\n</ol>\n<h3>Non-Root | LSPatch</h3>\n<p><strong>No
      guarantee that this will work for you, the module was developed to be used with
      LSPosed in mind!</strong></p>\n<ol>\n<li>Install <a href=\"https://play.google.com/store/apps/details?id=moe.shizuku.privileged.api\"
      rel=\"nofollow\">Shizuku</a> and <a href=\"https://github.com/JingMatrix/LSPatch/releases\">LSPatch</a>
      (<strong>MUST USE JINGMATRIX'S LSPATCH  FORK, OFFICIAL WON'T WORK</strong>).</li>\n<li>Download
      the latest release APK from the assets section below or simply <a href=\"https://github.com/Xposed-Modules-Repo/com.wizpizz.reddidnt/releases/download/7-1.2.2/app-release.apk\">click
      here</a></li>\n<li>Install the APK on your device.</li>\n<li>Give LSPatch Shizuku
      permissions.</li>\n<li>In LSPatch, patch the Reddit app: <strong>select LOCAL</strong>
      while patching, DO NOT INTEGRATE and don't embed Reddidn't.</li>\n<li>Install
      the patched Reddit.</li>\n<li>Long press on Reddit in LSPatch and select \"Module
      Scope\".</li>\n<li>Select Reddidn't from the list.</li>\n<li>That's it. Restart
      Reddit and ads should be gone!</li>\n</ol>\n<p>(Reddidn't will still stay \"module
      not activated\", ignore that. Toggling off ad blocking features in Reddidn't
      won't do anything, ads will always be blocked as long as Reddidn't is selected
      in the scope in LSPatch)</p>"

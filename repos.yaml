com.hchen.appretention:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: AppRetention-v5.2.2.2025021500._release.apk
    Id: com.hchen.appretention
    LastUpdated: "2025-02-15T09:16:33Z"
    Name: AppRetention
    ReleaseDescription: "<h1>\U0001F389 AppRetention v.5.2.2 更新！！</h1>\n<h3>\U0001F40D
      这里先祝新年快乐，蛇年接福纳瑞！</h3>\n<h3>\U0001F680 v.5.2.2 版本修复了 v.5.1+ 版本的严重 BUG，对造成的麻烦深表歉意；此版本已经修复！欢迎尝试！</h3>\n<hr>\n<h4>v.5.2.2
      更新日志：</h4>\n<p>\U0001F41B - 修复 Miui14 以下系统，点击电量和性能相关设置时软重启问题。</p>\n<hr>\n<h4>v.5.2.1
      更新日志：</h4>\n<p>\U0001F41B - 修复一处可能的崩溃。</p>\n<hr>\n<h4>v.5.2.0 更新日志：</h4>\n<p>\U0001F41B
      - 修复导致频繁重启的恶性 BUG。<br>\n\U0001F4F1 - 最低支持安卓版本调整至安卓 10。<br>\n\U0001F680 - 完善对安卓
      12 的适配，启用压缩功能。<br>\n\U0001F4BE - 启用小米的 ExtM 功能，启用 dm 优化（即内存拓展功能）。<br>\n\U0001F6E0️
      - 修复错误的日志输出内容，优化混淆规则。<br>\n\U0001F6E0️ - 重命名日志文件 <code>CrashEventListener</code>
      至 <code>CrashEvent</code>。<br>\n\U0001F496 - 添加情人节祝福，祝有情人终成眷属~</p>\n<hr>\n<h4>v.5.1
      更新日志：</h4>\n<p>\U0001F680 - 深度优化适配 HyperOS V1、V2，优化适配 A15、A14 等。<br>\n\U0001F4BE
      - 新增内存压缩功能，帮助减少应用内存占用大小。<br>\n\U0001F3AF - 深度优化米系手机在启动相机时容易大规模杀后台的问题。<br>\n\U0001F4DD
      - 新增全新的日志系统，模块日志存储至：<code>/data/system/AppRetention/</code> 内。<br>\n\U0001F389
      - 全新适配三星 OneUi 系统！本模块可能是第一个支持三星的保后台模块了！<br>\n\U0001F4F1 - 支持最低安卓版本调动至安卓 11。<br>\n⚙️
      - 支持调整 <code>mOomMinFree</code> 数值。<br>\n\U0001F442 - 支持监听系统 kill 事件。（Tip：需要手动开启）<br>\n\U0001F6E0️
      - 使用 HookTool 工具，统一 Hook 流程。<br>\n\U0001F43E - 更换模块图标，更加可爱~</p>\n<hr>\n<h4>重要提醒：</h4>\n<p><g-emoji
      class=\"g-emoji\" alias=\"warning\">⚠️</g-emoji> - v.5.1+ 版本暂未针对 Color 系统进行适配，当然也可以使用，但效果不敢保证。<br>\n\U0001F504
      - 可以选择继续在旧版本或者等待更新适配！敬请谅解。</p>\n<hr>\n<h4>KillEvent 开启方法：</h4>\n<p>\U0001F6E0️
      - <code>settings put system kill_event_log_record_enable true</code> 开启后将在后台持续监听系统的
      kill 事件，等价于 logcat -b events | grep kill ,开启可能增加耗电量，关闭把 true 改成 false 并执行即可。</p>\n<hr>\n<h4>群组：</h4>\n<p>\U0001F4AC

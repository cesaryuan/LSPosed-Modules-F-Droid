ai.noads.NoAdsTelegram:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: NoAdsTelegram-v0.8.apk
    Id: ai.noads.NoAdsTelegram
    LastUpdated: "2026-02-17T22:26:59Z"
    Name: NoAdsTelegram  An Xposed module for the official Telegram app that removes
      ads (sponsored messages, video ads), enables forwarding and saving of messages,
      allows saving stories, prevents message deletion (recall), and provides configurable
      options via preferences.
    ReleaseDescription: |-
      <p>The 'One Hook at a Time' hmm...</p>
      <p>We started with a simple idea: remove ads, enable forwarding. Then things escalated. Now we have so many hooks you could hang a coat on them. Here's what's new in this release:</p>
      <p>New Features</p>
      <p>Secret Chat Shenanigans</p>
      <p>Disable message deletion in secret chats (yes, really).<br>
      Disable self‑destruct – timers now hit zero and just… stop. Like a movie cliffhanger.<br>
      Save media from secret chats. Your secret is safe with us.</p>
      <p>Chat Deletion? What Chat Deletion?</p>
      <p>New option to disable chat deletion entirely. But there's a twist: if you delete a chat while this is on, it will reappear after restart. It's like a chat zombie apocalypse.</p>
      <p>Privacy Gains</p>
      <p>Hide your typing indicator – because sometimes you want to lurk in silence.</p>
      <p>Improvements</p>
      <p>Settings got a makeover – all hooks are now grouped by category (Ads, Messaging, Secret Chat, Stories, UI, Privacy). No more scrolling through a chaotic list. You're welcome.<br>
      Story saving: now with more saving – we made it work better.</p>
      <p>The Usual Disclaimer</p>
      <p>Use at your own risk. We're not responsible if Telegram starts sending you postcards from the Bermuda Triangle or if your self‑destruct timer develops existential dread.</p>
      <p>Happy hooking!<br>
      — The NoAdsTelegram Team (size: 1 very busy human)</p>
  AuthorName: igormsc
  GitURL: https://github.com/Xposed-Modules-Repo/ai.noads.NoAdsTelegram
  Host: ""
  License: ""
  Name: ""
  Owner: ""
  Summary: |-
    NoAdsTelegram

    Everything is configurable – mix and match your perfect Telegram.

    Enable forwarding & saving – even on content that was locked down.
    Enable saving stories – download and keep stories for later.
    Disable sponsored messages – no more "promoted channels" cluttering your chat list.
    Disable video ads – watch videos ad‑free.
    Disable message deletion – if someone said it, they said it. (a.k.a. anti‑recall)
    Disable chat deletion – stop chats from disappearing… but beware: they might just come back…

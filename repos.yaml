      new patches, your old YouTube ReVanced settings <strong>will not</strong> carry
      over automatically. <strong>You must export them before installing this update.</strong></p>\n<p><strong>Migration
      Steps:</strong></p>\n<ol>\n<li><strong>Backup:</strong> Open your current <strong>YouTube</strong>
      app, go to <code>Settings -&gt; ReVanced -&gt; Misc -&gt; Import/Export</code>,
      and copy your settings.</li>\n<li><strong>Update:</strong> Install NexAlloy
      over your existing app.</li>\n<li><strong>Restore:</strong> Open <strong>YouTube</strong>
      again, navigate to the new <code>Settings -&gt; Morphe -&gt; Misc -&gt; Import/Export</code>,
      paste the settings you just copy.</li>\n</ol>\n<p><a href=\"https://github.com/chsbuffer/ReVancedXposed/releases/tag/2.0.102\">Changelog</a></p>"

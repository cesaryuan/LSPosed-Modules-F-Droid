com.fan.edgex:
  Applications:
  - AntiFeatures: null
    Categories:
    - Xposed
    Description: ""
    Filename: EdgeX-v1.3.0-20260428.apk
    Id: com.fan.edgex
    LastUpdated: "2026-04-28T15:30:58Z"
    Name: EdgeX - Gesture Control
    ReleaseDescription: "                                                                                               \n<h2>✨
      Features</h2>\n<ul>\n<li><strong>Freezer drawer redesign</strong>: Material
      You aesthetics, improved portrait/landscape layout with more columns and cleaner
      card style</li>\n<li><strong>Clipboard action</strong>: new action type to paste
      clipboard content</li>\n<li><strong>Haptic feedback</strong>: optional haptic
      feedback for edge gestures (Advanced Options)</li>\n</ul>\n<h2>\U0001F527 Fix
      &amp; Improve</h2>\n<ul>\n<li><strong>All hooks now run entirely in <code>system_server</code></strong>:
      removed the SystemUI process dependency — the module no longer requires the
      EdgeX app to be running in the background to function (shell command actions
      are the only exception)</li>\n<li><strong>Hook config persistence</strong>:
      config snapshot is cached in device storage and refreshed on boot, so settings
      survive without the app process staying alive</li>\n<li><strong>Shell command
      reliability</strong>: shell actions are dispatched to the app process via an
      AIDL-bound service, which reliably wakes a stopped process on Android 15</li>\n<li><strong>Drawer
      rotation fix</strong>: drawer layout now redraws correctly on screen rotation</li>\n<li><strong>Xposed
      scope cleaned up — <code>system</code> entry removed, only <code>android</code>
      is required</strong></li>\n<li><strong>License changed to GPLv3</strong> (previously
      MIT)</li>\n</ul>\n                                                 \n<h2>✨ 新功能</h2>\n<ul>\n<li><strong>冻结抽屉重设计</strong>：采用
      Material You 风格，竖屏列数增加，卡片样式更简洁，横屏布局优化</li>\n<li><strong>剪贴板动作</strong>：新增粘贴剪贴板内容的动作类型</li>\n<li><strong>触觉反馈</strong>：在高级选项中可开启边缘手势的震动反馈</li>\n</ul>\n<h2>\U0001F527
      修复与优化</h2>\n<ul>\n<li><strong>所有 Hook 逻辑统一在 <code>system_server</code> 中运行</strong>：移除了对
      SystemUI 进程的依赖——除 Shell命令动作外，模块不再依赖 EdgeX 应用本身常驻后台即可正常工作</li>\n<li><strong>Hook
      配置持久化</strong>：配置快照缓存至设备存储并在开机后自动刷新，设置无需应用进程保持存活即可生效</li>\n<li><strong>Shell
      命令执行可靠性提升</strong>：Shell 动作通过 AIDL 绑定服务分发到应用进程执行，在 Android 15上可可靠唤醒已停止的应用进程</li>\n<li><strong>修复横竖屏切换时抽屉不刷新的问题</strong></li>\n<li><strong>Xposed
      作用域精简，移除多余的 <code>system</code> 条目，仅需 <code>android</code></strong></li>\n<li><strong>开源协议变更为
      GPLv3</strong>（原为 MIT）</li>\n</ul>"
  AuthorName: fcmfcm1999
  GitURL: https://github.com/Xposed-Modules-Repo/com.fan.edgex
  Host: ""
  License: ""
  Name: ""
  Owner: ""
  Summary: |-
    Gesture Control Module
    手势控制插件
